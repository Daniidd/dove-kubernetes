services:
  mysql:
    image: mysql:8.4
    container_name: dove-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: dove
      MYSQL_USER: dove_user
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - dove-network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./dove-restaurante-api
      dockerfile: Dockerfile

    container_name: dove-backend
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      JWT_ALGORITMO: ${JWT_ALGORITMO}
      HORAS_EXPIRACAO_TOKEN: ${HORAS_EXPIRACAO_TOKEN}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}

    networks:
      - dove-network

  frontend:
    build:
      context: ./dove-restaurante-web
      dockerfile: Dockerfile

    container_name: dove-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - dove-network

volumes:
  mysql_data:

networks:
  dove-network:
    driver: bridge